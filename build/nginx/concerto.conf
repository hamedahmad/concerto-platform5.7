server {
    listen 80;

    root /usr/src/concerto/web;
    index app.php index.html;

    # ✅ CRITICAL FIX
    location /bundles/ {
        root /usr/src/concerto/web;
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        expires max;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri /app.php$is_args$args;
    }

    location ~ ^/app\.php(/|$) {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME /usr/src/concerto/web/app.php;
    }

    location ~ \.php$ {
        return 404;
    }
}